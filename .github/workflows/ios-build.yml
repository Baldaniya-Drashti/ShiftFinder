name: Build iOS IPA

on:
  push:
    branches:
      - testing_drashti  # Change to your development branch if needed

jobs:
  build:
    runs-on: macos-latest  # macOS runner is required for Xcode

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Setup Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer 

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod repo update
          pod install --verbose 
      
      - name: Install xcpretty (for clean logs)
        run: gem install xcpretty

      - name: Set Up Provisioning Profile & Certificates
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "🔑 Setting up provisioning profiles and certificates..."

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "$P12_BASE64" | base64 --decode -o cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/ShiftFinder_Profile.mobileprovision

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          echo "✅ Provisioning and certificates set up successfully."
          
      
      - name: Build IPA
        run: |
          echo "🚀 Starting Xcode build..."
          cd ios

          if [ ! -f exportOptions.plist ]; then
          echo "❌ exportOptions.plist not found! Make sure it is included in the repo."
            exit 1
          fi

          # Define correct paths using $GITHUB_WORKSPACE
          ARCHIVE_PATH="$GITHUB_WORKSPACE/ios/build/Runner.xcarchive"
          
          EXPORT_PATH="$GITHUB_WORKSPACE/ios/build/"

      - name: Archive the App (Debugging Mode)
        run: |
          xcodebuild clean archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/ios/build/Runner.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates

          # Check if archive exists before proceeding
          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "❌ Archive failed! Runner.xcarchive not found."
            exit 1
          fi

          echo "📦 Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist exportOptions.plist \
            -allowProvisioningUpdates | xcpretty

          # Check if IPA was created successfully
          if [ ! -f "$EXPORT_PATH/Runner.ipa" ]; then
            echo "❌ IPA export failed!"
            exit 1
          fi

          # Lock the keychain after the build
          security lock-keychain build.keychain

          echo "✅ Build completed successfully."  

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App
          path: build/*.ipa