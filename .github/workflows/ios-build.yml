name: Build iOS IPA

on:
  push:
    branches:
      - testing_drashti  # Change to your development branch if needed

jobs:
  build:
    runs-on: macos-latest  # macOS runner is required for Xcode

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.29.2

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Setup Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer 

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod repo update
          pod install --verbose 
      
      - name: Install xcpretty (for clean logs)
        run: gem install xcpretty

      - name: Generate Freezed & Other Code
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
      
      - name: Ensure Flutter iOS Project is Generated
        run: |
          flutter clean
          flutter pub get
          flutter build ios --no-codesign
      
      - name: Check iOS Workspace
        run: |
          cd ios
          ls -la
          if [ ! -d "Runner.xcworkspace" ]; then
            echo "❌ Runner.xcworkspace not found! Build will fail."
            exit 1
          fi
      
      - name: List Xcode Schemes
        run: |
          cd ios
          xcodebuild -list

      - name: Set Up Provisioning Profile & Certificates
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "🔑 Setting up provisioning profiles and certificates..."

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain

          echo "$P12_BASE64" | base64 --decode -o cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/ShiftFinder_Profile.mobileprovision

          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          echo "✅ Provisioning and certificates set up successfully."
          
      
      - name: Build IPA
        run: |
          echo "🚀 Starting Xcode build..."
          cd ios

          if [ ! -f exportOptions.plist ]; then
          echo "❌ exportOptions.plist not found! Make sure it is included in the repo."
            exit 1
          fi

      - name: Archive the App (Debugging Mode)
        run: |
          echo "🔍 GITHUB_WORKSPACE is: $GITHUB_WORKSPACE"
          cd ios
           if [ ! -f "Runner.xcworkspace/contents.xcworkspacedata" ]; then
            echo "❌ Runner.xcworkspace is missing!"
            ls -la
            exit 1
          fi
          
          xcodebuild clean archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/ios/build/Runner.xcarchive" \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates

          # Check if archive exists before proceeding
          if [ ! -d "$GITHUB_WORKSPACE/ios/build/Runner.xcarchive" ]; then
            echo "❌ Archive failed! Runner.xcarchive not found."
            exit 1
          fi

          echo "📦 Exporting IPA..."
          xcodebuild -exportArchive \
            -archivePath "$GITHUB_WORKSPACE/ios/build/Runner.xcarchive" \
            -exportPath "$GITHUB_WORKSPACE/ios/build/" \
            -exportOptionsPlist $GITHUB_WORKSPACE/ios/exportOptions.plist \
            -allowProvisioningUpdates | xcpretty

          # Lock the keychain after the build
          security lock-keychain build.keychain

          echo "✅ Build completed successfully."  

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-App
          path: build/*.ipa